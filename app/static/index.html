<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Encurtador de links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0E17;
    --bg-dot: rgba(255,255,255,0.025);
    --panel: #111826;
    --panel-2: #161F30;
    --border: #232E44;
    --text: #E8ECF4;
    --muted: #8992A6;
    --muted-2: #626C81;
    --accent: #4C8DFF;
    --accent-dark: #3568D6;
    --accent-glow: rgba(76, 141, 255, 0.35);
    --green: #34B27B;
    --purple: #8C74E8;
    --amber: #DDA23F;
    --cyan: #3CBBCF;
    --error: #E2604F;
    --error-bg: rgba(226, 96, 79, 0.1);
    --radius: 10px;
    --radius-sm: 7px;
  }

  html[data-theme="light"]{
    --bg: #F3F4F7;
    --bg-dot: rgba(10,14,23,0.035);
    --panel: #FFFFFF;
    --panel-2: #F5F6F9;
    --border: #E2E5EC;
    --text: #171B26;
    --muted: #666F84;
    --muted-2: #8991A3;
    --accent-glow: rgba(76, 141, 255, 0.22);
    --error-bg: rgba(226, 96, 79, 0.08);
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 1px 1px, var(--bg-dot) 1px, transparent 0) 0 0/20px 20px,
      var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 28px 16px 60px;
    transition: background-color 160ms ease, color 160ms ease;
  }

  .page{
    width: 100%;
    max-width: 620px;
    margin: 0 auto;
  }

  a{ color: inherit; }

  /* ---------- header ---------- */
  header{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius) var(--radius) 0 0;
    border-bottom: none;
    padding: 18px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
  }
  header::after{
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    box-shadow: 0 0 14px 1px var(--accent-glow);
  }

  .brand{
    display: flex;
    align-items: center;
    gap: 9px;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.01em;
  }
  .brand svg{ color: var(--accent); flex-shrink: 0; }

  .theme-toggle{
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--muted);
    cursor: pointer;
  }
  .theme-toggle:hover{ color: var(--text); border-color: var(--muted-2); }
  .theme-toggle svg{ width: 16px; height: 16px; }
  html[data-theme="dark"] .theme-toggle .icon-sun{ display: none; }
  html[data-theme="light"] .theme-toggle .icon-moon{ display: none; }

  /* ---------- main card ---------- */
  main{
    background: var(--panel);
    border: 1px solid var(--border);
    border-top: none;
    padding: 34px 28px;
  }

  h1{
    margin: 0 0 22px;
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .input-row{
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  input[type="url"]{
    flex: 1 1 220px;
    min-width: 0;
    font-family: "JetBrains Mono", monospace;
    font-size: 14px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--panel-2);
    color: var(--text);
  }
  input[type="url"]::placeholder{ color: var(--muted-2); }
  input[type="url"]:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  button{
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .paste-btn{
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .paste-btn:hover{ color: var(--text); border-color: var(--muted-2); }
  .paste-btn svg{ width: 14px; height: 14px; }

  .submit-btn{
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px -4px var(--accent-glow);
  }
  .submit-btn:hover{ background: var(--accent-dark); }
  .submit-btn:disabled{ background: var(--muted-2); box-shadow: none; cursor: default; }

  .error{
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    background: var(--error-bg);
    color: var(--error);
    font-size: 13px;
  }
  .error[hidden]{ display: none; }

  /* ---------- result ---------- */
  .result{
    display: none;
    margin-top: 22px;
    padding-top: 22px;
    border-top: 1px solid var(--border);
  }
  .result.is-visible{ display: block; }

  .result__label{
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 10px;
  }

  .result__row{ display: flex; gap: 8px; }

  .result__code{
    flex: 1;
    min-width: 0;
    font-family: "JetBrains Mono", monospace;
    font-size: 16px;
    font-weight: 600;
    padding: 11px 13px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow-x: auto;
    white-space: nowrap;
    color: var(--accent);
  }

  .copy-btn{
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .copy-btn:hover{ border-color: var(--muted-2); }
  .copy-btn[data-copied="true"]{ color: var(--green); border-color: var(--green); }

  .result__target{
    margin: 10px 0 0;
    font-size: 12.5px;
    color: var(--muted);
    word-break: break-all;
  }
  .result__target a{ color: var(--muted); text-decoration: none; }
  .result__target a:hover{ color: var(--text); text-decoration: underline; }

  /* ---------- history ---------- */
  .history{
    background: var(--panel);
    border: 1px solid var(--border);
    border-top: 1px solid var(--border);
    padding: 18px 22px 6px;
  }
  .history[hidden]{ display: none; }

  .history__head{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .history__label{ font-size: 12px; color: var(--muted); margin: 0; }
  .history__clear{
    background: none;
    border: none;
    padding: 4px 0;
    color: var(--muted);
    font-size: 12px;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .history__clear:hover{ color: var(--text); }

  .history__item{
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 12px 0;
    border-top: 1px solid var(--border);
    font-size: 13px;
  }
  .history__item code{
    font-family: "JetBrains Mono", monospace;
    font-weight: 600;
    color: var(--accent);
    flex-shrink: 0;
  }
  .history__item a{
    color: var(--muted);
    text-decoration: none;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .history__item a:hover{ color: var(--text); text-decoration: underline; }
  .history__time{
    color: var(--muted-2);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
    font-size: 12px;
  }

  /* ---------- footer ---------- */
  footer{
    margin-top: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-size: 12px;
    color: var(--muted);
  }
  .status-dot{
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted-2);
    flex-shrink: 0;
  }
  .status-dot[data-state="up"]{ background: var(--green); box-shadow: 0 0 6px 1px var(--green); }
  .status-dot[data-state="down"]{ background: var(--error); }

  @media (prefers-reduced-motion: no-preference){
    .result.is-visible{ animation: reveal 200ms ease-out; }
  }
  @keyframes reveal{
    from{ opacity: 0; transform: translateY(4px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px){
    main{ padding: 26px 18px; }
  }
</style>
</head>
<body>

<div class="page">

  <header>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <path d="M9 15l6-6"/>
        <path d="M8 6.5A3.5 3.5 0 0 1 11.5 3h1A3.5 3.5 0 0 1 16 6.5v0A3.5 3.5 0 0 1 12.5 10"/>
        <path d="M16 17.5A3.5 3.5 0 0 1 12.5 21h-1A3.5 3.5 0 0 1 8 17.5v0A3.5 3.5 0 0 1 11.5 14"/>
      </svg>
      <span>encurtador</span>
    </div>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Alternar tema claro/escuro">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.5a8.5 8.5 0 0 1-11-11 8.5 8.5 0 1 0 11 11z"/></svg>
    </button>
  </header>

  <main>
    <h1>Encurtador de link</h1>

    <form id="shorten-form" novalidate>
      <div class="input-row">
        <input
          id="url-input"
          type="url"
          name="url"
          placeholder="Cole aqui sua URL"
          autocomplete="off"
          required
        />
        <button type="button" class="paste-btn" id="paste-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
          Colar
        </button>
        <button type="submit" class="submit-btn" id="submit-btn">Encurtar</button>
      </div>
      <p class="error" id="error-msg" role="alert" hidden></p>
    </form>

    <div class="result" id="result" aria-live="polite">
      <p class="result__label">Seu link curto</p>
      <div class="result__row">
        <div class="result__code" id="short-url"></div>
        <button class="copy-btn" id="copy-btn" type="button">Copiar</button>
      </div>
      <p class="result__target">Aponta para <a id="original-url" href="#" target="_blank" rel="noopener"></a></p>
    </div>
  </main>

  <div class="history" id="history" hidden>
    <div class="history__head">
      <p class="history__label">Encurtados recentemente neste navegador</p>
      <button type="button" class="history__clear" id="clear-history">Limpar</button>
    </div>
    <div id="history-list"></div>
  </div>

  <footer>
    <span class="status-dot" id="status-dot" data-state="unknown"></span>
    <span id="status-text">Verificando o servidor…</span>
  </footer>

</div>

<script>
  const form = document.getElementById('shorten-form');
  const urlInput = document.getElementById('url-input');
  const submitBtn = document.getElementById('submit-btn');
  const pasteBtn = document.getElementById('paste-btn');
  const errorMsg = document.getElementById('error-msg');
  const result = document.getElementById('result');
  const shortUrlEl = document.getElementById('short-url');
  const originalUrlEl = document.getElementById('original-url');
  const copyBtn = document.getElementById('copy-btn');
  const historyWrap = document.getElementById('history');
  const historyList = document.getElementById('history-list');
  const clearHistoryBtn = document.getElementById('clear-history');
  const statusDot = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');
  const themeToggle = document.getElementById('theme-toggle');

  const HISTORY_KEY = 'encurtador:historico';
  const THEME_KEY = 'encurtador:tema';

  /* ---- tema ---- */
  const savedTheme = localStorage.getItem(THEME_KEY);
  if(savedTheme){ document.documentElement.setAttribute('data-theme', savedTheme); }

  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem(THEME_KEY, next);
  });

  /* ---- colar da área de transferência ---- */
  pasteBtn.addEventListener('click', async () => {
    try{
      const text = await navigator.clipboard.readText();
      if(text){ urlInput.value = text.trim(); }
    }catch{
      /* permissão negada pelo navegador: usuário cola manualmente */
    }
    urlInput.focus();
  });

  /* ---- histórico local ---- */
  function loadHistory(){
    try{
      return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
    }catch{
      return [];
    }
  }

  function saveToHistory(entry){
    const items = loadHistory();
    items.unshift({ ...entry, saved_at: Date.now() });
    localStorage.setItem(HISTORY_KEY, JSON.stringify(items.slice(0, 6)));
    renderHistory();
  }

  function formatTime(ts){
    if(!ts) return '';
    return new Date(ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  function renderHistory(){
    const items = loadHistory();
    if(items.length === 0){
      historyWrap.hidden = true;
      return;
    }
    historyWrap.hidden = false;
    historyList.innerHTML = items.map(item => `
      <div class="history__item">
        <code>${item.short_code}</code>
        <a href="${item.original_url}" target="_blank" rel="noopener">${item.original_url}</a>
        <span class="history__time">${formatTime(item.saved_at)}</span>
      </div>
    `).join('');
  }

  clearHistoryBtn.addEventListener('click', () => {
    localStorage.removeItem(HISTORY_KEY);
    renderHistory();
  });

  /* ---- envio do formulário ---- */
  function showError(message){
    errorMsg.textContent = message;
    errorMsg.hidden = false;
  }

  async function parseErrorMessage(response){
    if(response.status === 422){
      return 'Isso não parece um link válido. Inclua http:// ou https:// no começo.';
    }
    return 'Não foi possível encurtar esse link agora. Tente de novo em instantes.';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.hidden = true;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Encurtando…';

    try{
      const response = await fetch('/shorten', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: urlInput.value })
      });

      if(!response.ok){
        throw new Error(await parseErrorMessage(response));
      }

      const data = await response.json();
      shortUrlEl.textContent = data.short_url;
      originalUrlEl.textContent = data.original_url;
      originalUrlEl.href = data.original_url;
      result.classList.add('is-visible');
      saveToHistory(data);
      urlInput.value = '';
      urlInput.focus();
    }catch(err){
      showError(err.message || 'Não foi possível encurtar esse link agora.');
    }finally{
      submitBtn.disabled = false;
      submitBtn.textContent = 'Encurtar';
    }
  });

  copyBtn.addEventListener('click', async () => {
    const text = shortUrlEl.textContent;
    try{
      await navigator.clipboard.writeText(text);
    }catch{
      const helper = document.createElement('textarea');
      helper.value = text;
      helper.style.position = 'fixed';
      helper.style.opacity = '0';
      document.body.appendChild(helper);
      helper.select();
      document.execCommand('copy');
      document.body.removeChild(helper);
    }
    const original = copyBtn.textContent;
    copyBtn.textContent = 'Copiado';
    copyBtn.dataset.copied = 'true';
    setTimeout(() => {
      copyBtn.textContent = original;
      copyBtn.dataset.copied = 'false';
    }, 1500);
  });

  /* ---- status do servidor ---- */
  async function checkStatus(){
    try{
      const response = await fetch('/health');
      if(response.ok){
        statusDot.dataset.state = 'up';
        statusText.textContent = 'Servidor no ar';
      }else{
        throw new Error('unhealthy');
      }
    }catch{
      statusDot.dataset.state = 'down';
      statusText.textContent = 'Servidor fora do ar no momento';
    }
  }

  renderHistory();
  checkStatus();
</script>

</body>
</html>
