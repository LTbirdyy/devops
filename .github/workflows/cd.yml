name: cd

# Dispara de duas formas:
#  1) Ao criar uma tag de versão (ex: v1.0.0): builda, publica e faz deploy.
#  2) Manualmente (Actions > cd > Run workflow) informando uma versão já
#     publicada: serve para ROLLBACK (reimplanta uma versão anterior).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a implantar, ex: 1.0.0 (use uma antiga para rollback)"
        required: true

jobs:
  build-and-push:
    # Só builda quando veio de uma tag nova; no rollback a imagem já existe
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # criar a release
      packages: write   # publicar no GHCR

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Nome da imagem em minúsculas (exigência do GHCR)
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags semânticas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Criar release no GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes

  deploy-homologacao:
    needs: build-and-push
    # Roda se o build deu certo OU foi pulado (caso do rollback manual)
    if: ${{ always() && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Ambiente "homologacao" do GitHub: é onde ficam os secrets do deploy
    environment: homologacao
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Definir versão a implantar
        id: version
        env:
          RAW: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          echo "version=${RAW#v}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy simulado (docker compose na própria runner)
        env:
          APP_IMAGE: ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          # Senha vem do Secrets Management do GitHub, nunca do código
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          echo "Implantando $APP_IMAGE"
          docker compose pull app
          docker compose up -d --no-build

      - name: Aguardar a aplicação ficar saudável
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health > /dev/null; then
              echo "Aplicação saudável após ${i} tentativa(s)"
              exit 0
            fi
            sleep 2
          done
          echo "A aplicação não respondeu ao /health a tempo"
          exit 1

      - name: Smoke test (encurta um link e confere o redirecionamento)
        run: |
          RESPONSE=$(curl -fs -X POST http://localhost:8000/shorten \
            -H "Content-Type: application/json" \
            -d '{"url": "https://www.example.com/teste-de-deploy"}')
          echo "Resposta: $RESPONSE"
          CODE=$(echo "$RESPONSE" | jq -r .short_code)
          LOCATION=$(curl -s -o /dev/null -w "%{redirect_url}" "http://localhost:8000/$CODE")
          echo "Redireciona para: $LOCATION"
          test "$LOCATION" = "https://www.example.com/teste-de-deploy"

      - name: Registrar versão implantada no resumo da execução
        run: |
          {
            echo "### Deploy em homologação concluído"
            echo "- Versão implantada: \`${{ steps.version.outputs.version }}\`"
            echo "- Imagem: \`ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}\`"
            echo "- Disparo: \`${{ github.event_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs dos containers (só se algo falhou)
        if: failure()
        env:
          APP_IMAGE: ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          docker compose logs --no-color
          echo "::error::Deploy falhou. Faça o rollback: Actions > cd > Run workflow com a última versão estável."

      - name: Limpar o ambiente simulado
        if: always()
        env:
          APP_IMAGE: ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: docker compose down -v
